  unsafe = true

[params]
  contentTypeName = "posts"
  showMenuItems = 2
  fullWidthTheme = true
  centerTheme = true

[languages]
  [languages.en]
    title = "Briar Patch"
    copyright = ""
    [languages.en.params]
      subtitle = "Bumbling Through Thorns"
      keywords = ""
      menuMore = "Show more"
      readMore = "Read more"
      readOtherPosts = "Read other posts"
    [languages.en.params.Logo]
      logoText = "Briar Patch"
      logoHomeLink = "/"

